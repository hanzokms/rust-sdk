[package]
name = "kms"
version = "0.0.3"
edition = "2021"
authors = [
  "Hanzo AI, Inc. <dev@hanzo.ai>",
]
description = "Official Rust SDK for Hanzo KMS"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/hanzokms/rust-sdk"
keywords = ["kms", "secrets", "sdk", "api"]
categories = ["api-bindings"]
homepage = "https://kms.hanzo.ai"
include = ["**/*.rs", "Cargo.toml"]

[dependencies]
reqwest = { version = "0.12", features = ['json', 'blocking', 'rustls-tls', 'http2'], default-features = false }
tokio = { version = "1.46", features = ["full"] }
serde = { version = "1", features = ['derive'] }
serde_json = "1"
thiserror = "1"
url = "2.5"
base64 = "0.22"

[dev-dependencies]
dotenvy = "0.15"
